  <body>
    <div id="root">
      <!-- 预埋静态 SEO 占位内容：供爬虫直接提取高质量文本，React 挂载后自动替换 -->
      <noscript>
        <h1>Animaku 动漫 - 在线高清动画多源聚合弹幕平台</h1>
        <p>Animaku 多资源聚合的日漫番剧、剧场版动画在线观看，支持高性能自研弹幕播放、1080P 高清画质、画质超分、OP / ED智能跳过、Bangumi 每日更新时间表与追番历史，打造轻快稳定的二次元追番体验。</p>
      </noscript>
    </div>
    <script>
      // Early theme paint before React — match animaku-settings localStorage
      try {
        var raw =
          localStorage.getItem('animaku-settings') ||
          localStorage.getItem('aniku-settings')
        var theme = 'light'
        if (raw) {
          var parsed = JSON.parse(raw)
          if (parsed && (parsed.state?.theme === 'dark' || parsed.theme === 'dark')) {
            theme = 'dark'
          } else if (parsed && (parsed.state?.theme === 'light' || parsed.theme === 'light')) {
            theme = 'light'
          }
        }
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.style.colorScheme = theme
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
