# Animaku — one-command deploy
#   cp .env.example .env   # set PORT / PUBLIC_PROXY / optional VITE_* branding
#   docker compose up -d --build
# Open http://localhost:${PORT:-8787}  (SPA + /api on same origin)
#
# PUBLIC_PROXY defaults to 1 (public clients can use media/plugin proxy APIs).
# Set PUBLIC_PROXY=0 for LAN-only lock-down. Anime1 full tunnel: MEDIA_FULL_PROXY=1.
# Footer branding (VITE_*): rebuild image after changing — baked at Vite build time.

services:
  animaku:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time only (Vite). Runtime .env changes will not update the footer / client SEO origin.
        BANGUMI_API: ${BANGUMI_API:-mirror}
        BANGUMI_IMAGE: ${BANGUMI_IMAGE:-mirror}
        VITE_BANGUMI_API_HOST: ${VITE_BANGUMI_API_HOST:-}
        VITE_BANGUMI_IMAGE_HOST: ${VITE_BANGUMI_IMAGE_HOST:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-}
        VITE_GITHUB_URL: ${VITE_GITHUB_URL:-}
        VITE_GITHUB_LABEL: ${VITE_GITHUB_LABEL:-}
        VITE_PRODUCT_NAME: ${VITE_PRODUCT_NAME:-}
        VITE_SITE_TAGLINE: ${VITE_SITE_TAGLINE:-}
        VITE_MAINTAINER_NAME: ${VITE_MAINTAINER_NAME:-}
        VITE_MAINTAINER_URL: ${VITE_MAINTAINER_URL:-}
        VITE_HOMEPAGE_URL: ${VITE_HOMEPAGE_URL:-}
        VITE_HOMEPAGE_LABEL: ${VITE_HOMEPAGE_LABEL:-}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
        VITE_FOOTER_NOTE: ${VITE_FOOTER_NOTE:-}
    image: animaku:local
    container_name: animaku
    # Host PORT → container PORT (production single process; no Vite)
    # Browser: http://localhost:$PORT
    ports:
      - "${PORT:-8787}:${PORT:-8787}"
    volumes:
      # Persistent SQLite database & cache directory (persists across container updates)
      - ./data:/app/data
    environment:
      # Listen inside the container (must match the right-hand side of ports)
      PORT: ${PORT:-8787}
      HOST: "0.0.0.0"
      WEB_DIST: "public"
      DATA_DIR: "/app/data"
      # Access / media (see .env.example). PUBLIC_PROXY default 1; MEDIA_FULL_PROXY default 0.
      PUBLIC_PROXY: ${PUBLIC_PROXY:-1}
      MEDIA_FULL_PROXY: ${MEDIA_FULL_PROXY:-0}
      PROXY_TOKEN: ${PROXY_TOKEN:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Public origin for /robots.txt Sitemap + /sitemap.xml (runtime)
      SITE_URL: ${SITE_URL:-}
      # Optional overrides; empty → use server built-in defaults (proper Bangumi UA, etc.)
      BANGUMI_API: ${BANGUMI_API:-mirror}
      BANGUMI_IMAGE: ${BANGUMI_IMAGE:-mirror}
      BANGUMI_API_HOST: ${BANGUMI_API_HOST:-}
      BANGUMI_IMAGE_HOST: ${BANGUMI_IMAGE_HOST:-}
      DANDAN_APP_ID: ${DANDAN_APP_ID:-}
      DANDAN_APP_SECRET: ${DANDAN_APP_SECRET:-}
      BANGUMI_USER_AGENT: ${BANGUMI_USER_AGENT:-}
      PRODUCT_USER_AGENT: ${PRODUCT_USER_AGENT:-}
      DEFAULT_USER_AGENT: ${DEFAULT_USER_AGENT:-}
      PLUGIN_SHOP: ${PLUGIN_SHOP:-}
      PLUGIN_SHOP_MIRROR: ${PLUGIN_SHOP_MIRROR:-}
      LOG_FORMAT: ${LOG_FORMAT:-pretty}
      TZ: ${TZ:-Asia/Shanghai}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    # Logging controller & log rotation persistence
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE:-5m}"
        max-file: "${LOG_MAX_FILE:-10}"
        compress: "true"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||8787)+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
